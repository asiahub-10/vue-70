<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Order · AdminPro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Desktop Sidebar (lg ও তার উপরে) ===== -->
  <aside class="sidebar bg-1 border-end">
    <a class="brand" href="index.html"><i class="bi bi-bar-chart-fill"></i> AdminPro</a>
    <nav class="side-nav">
        <a class="side-link" href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="side-link" href="orders.html"><i class="bi bi-table"></i> Orders</a>
        <a class="side-link active" href="add-order.html"><i class="bi bi-plus-circle"></i> Add Order</a>
    </nav>
  </aside>

  <!-- ===== Mobile Sidebar (Bootstrap Drawer) ===== -->
  <dialog class="drawer drawer-start" id="mobileSidebar" tabindex="-1" aria-labelledby="mobileSidebarLabel">
    <div class="drawer-header">
      <h5 class="drawer-title" id="mobileSidebarLabel">AdminPro</h5>
      <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
    </div>
    <div class="drawer-body side-nav">
        <a class="side-link" href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="side-link" href="orders.html"><i class="bi bi-table"></i> Orders</a>
        <a class="side-link active" href="add-order.html"><i class="bi bi-plus-circle"></i> Add Order</a>
    </div>
  </dialog>

  <div class="main">

    <!-- ===== Navbar ===== -->
    <header class="navbar topbar bg-1 border-bottom">
      <button class="btn-icon menu-toggle" type="button" data-bs-toggle="drawer"
              data-bs-target="#mobileSidebar" aria-controls="mobileSidebar" aria-label="Open menu">
        <i class="bi bi-list fs-xl"></i>
      </button>
      <span class="topbar-title">Add Order</span>

      <div class="topbar-right">
        <!-- Bootstrap Toggler plugin: <html> এর data-bs-theme অ্যাট্রিবিউট অন/অফ করে -->
        <button type="button" class="btn-icon" aria-label="Toggle dark mode"
                data-bs-toggle="toggler" data-bs-target="html"
                data-bs-attribute="data-bs-theme" data-bs-value="dark">
          <i class="bi bi-moon-stars"></i>
        </button>

        <!-- Bootstrap Menu plugin -->
        <div>
          <button type="button" class="btn-text user-btn" data-bs-toggle="menu" aria-expanded="false">
            <span class="user-badge">SA</span>
            <span class="d-none sm:d-inline">Sabbir</span>
          </button>
          <div class="menu">
            <a class="menu-item" href="#">Profile</a>
            <a class="menu-item" href="#">Settings</a>
            <div class="menu-divider"></div>
            <a class="menu-item" href="#">Logout</a>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="page-head">
        <div>
          <h1 class="page-title">Add Order</h1>
          <p class="muted">Create a new customer order</p>
        </div>
        <a class="btn-outline theme-secondary" href="orders.html"><i class="bi bi-arrow-left"></i> Back to orders</a>
      </div>

      <section class="section-gap">
        <div class="card"><div class="card-body">
          <!-- data-bs-validate: Bootstrap 6 ভ্যালিডেশন (ইউজার টাইপ করার পর :user-invalid স্টাইল) -->
          <form action="orders.html" method="get" data-bs-validate>
            <div class="row g-3">
              <div class="col-12 md:col-6">
                <div class="form-field">
                  <label class="form-label" for="fName">Customer name</label>
                  <input type="text" class="form-control" id="fName" name="name" required minlength="3" placeholder="e.g. Rahim Uddin">
                </div>
              </div>
              <div class="col-12 md:col-6">
                <div class="form-field">
                  <label class="form-label" for="fEmail">Email</label>
                  <input type="email" class="form-control" id="fEmail" name="email" required placeholder="name@example.com">
                </div>
              </div>
              <div class="col-12 md:col-6 xl:col-3">
                <div class="form-field">
                  <label class="form-label" for="fProduct">Product</label>
                  <select class="form-control" id="fProduct" name="product" required>
                    <option value="">Choose...</option>
                    <option>Polo Shirt</option>
                    <option>Denim Jeans</option>
                    <option>Hoodie</option>
                    <option>Panjabi</option>
                  </select>
                </div>
              </div>
              <div class="col-12 md:col-6 xl:col-3">
                <div class="form-field">
                  <label class="form-label" for="fAmount">Amount (৳)</label>
                  <input type="number" class="form-control" id="fAmount" name="amount" required min="1" placeholder="1500">
                </div>
              </div>
              <div class="col-12 md:col-6 xl:col-3">
                <div class="form-field">
                  <label class="form-label" for="fStatus">Status</label>
                  <select class="form-control" id="fStatus" name="status" required>
                    <option>Pending</option>
                    <option>Completed</option>
                    <option>Cancelled</option>
                  </select>
                </div>
              </div>
              <div class="col-12 md:col-6 xl:col-3">
                <div class="form-field">
                  <label class="form-label" for="fDate">Date</label>
                  <input type="date" class="form-control" id="fDate" name="date" required>
                </div>
              </div>
              <div class="col-12">
                <div class="form-field">
                  <label class="form-label" for="fNote">Note (optional)</label>
                  <textarea class="form-control" id="fNote" name="note" rows="2"></textarea>
                </div>
              </div>
              <div class="col-12 form-actions">
                <button type="submit" class="btn-solid theme-primary"><i class="bi bi-plus-lg"></i> Add order</button>
                <button type="reset" class="btn-outline theme-secondary">Reset</button>
              </div>
            </div>
          </form>
        </div></div>
      </section>

      <footer class="muted small footer">© 2026 AdminPro · Built with Bootstrap 6 alpha</footer>
    </main>
  </div>

  <!-- শুধু Bootstrap 6 JS -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
